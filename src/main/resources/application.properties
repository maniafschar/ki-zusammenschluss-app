spring.application.name=ki-experten-website
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/kiexperten;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD}

# Booking confirmation e-mails. Without spring.mail.host the confirmation link is only written to the log.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:no-reply@localhost}
